name = "my-property-site"
compatibility_date = "2024-09-01"
pages_build_output_dir = "public"

# 部署後，請到 Cloudflare Pages 專案的 Settings 內完成以下綁定：
#
# 1. KV 命名空間綁定：
#    變數名稱 (Variable name): LISTINGS_KV
#    綁定到你建立的 KV namespace（例如 property-listings）
#
# 2. R2 儲存桶綁定（用於圖片/影片檔案）：
#    變數名稱 (Variable name): LISTINGS_R2
#    綁定到你建立的 R2 bucket（例如 property-media）
#
# 3. 環境變數 / 密鑰：
#    ADMIN_PASSWORD = 你自訂的後台登入密碼（請設定為 Secret，不要用一般環境變數）
#    R2_PUBLIC_BASE_URL = （選填）如果你有幫 R2 bucket 設定自訂公開網域，填在這裡，
#                          例如 https://media.yourdomain.com
#                          沒有設定的話，檔案會透過 /r2/<key> 這個路徑提供，一樣可以正常顯示。
#
# 這些綁定無法透過 wrangler.toml 完全自動化設定（KV/R2 的 id 每個帳號不同），
# 建議直接在 Cloudflare Pages 專案的 Dashboard 介面設定，步驟請見 README.md。
